# Jarvis Cloud: stores your plan and exposes it to the Jarvis app and to Claude (MCP).
name = "jarvis-core"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Give the Worker its public https://jarvis-core.<account>.workers.dev address.
workers_dev = true
preview_urls = false

# One Durable Object holds the whole plan, so every read sees the latest write.
[[durable_objects.bindings]]
name = "PLAN"
class_name = "PlanStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlanStore"]

# Secret (set in the Cloudflare dashboard, never in this file):
#   JARVIS_TOKEN  a long random string. The app sends it as a Bearer token,
#                 and Claude's connector URL ends with it: https://<worker>/mcp/<token>
